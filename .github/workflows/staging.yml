name: Platform staging
on:
  workflow_call:
    inputs:
      platform-ref:
        type: string
        required: true
      config:
        type: string
        default: platform.json
      runner:
        type: string
        default: ubuntu-24.04
permissions:
  contents: read
  deployments: write
  id-token: write
concurrency:
  group: platform-staging
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    environment: staging
    env:
      PLATFORM_REF: ${{ inputs.platform-ref }}
      CONFIG: ${{ inputs.config }}
    steps:
      - name: Validate platform pin
        env:
          PLATFORM_REF: ${{ inputs.platform-ref }}
        run: '[[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paris-phan/platform
          ref: ${{ inputs.platform-ref }}
          path: _platform
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: project
          persist-credentials: false
      - name: Build deploy and verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 _platform/scripts/release.py stage --root project --config "$CONFIG" --bundle release-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
